# Builds the container image and pushes it to GitHub's registry (ghcr.io) on every push to
# main and on version tags; pull requests only build. The image holds no models: the
# container downloads them on first start (AUTO_MODELS), see the README.
name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/avandeputte/iopix
  # the image name from before the rename keeps receiving the same builds, so existing stacks keep updating

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax and import checks
        run: |
          python -m pip install -q -e ".[test]"
          python -m pyflakes app
          python -c "import app.main"
          for f in static/app.js static/js/*.js; do node --input-type=module --check < "$f" || exit 1; done; node --check static/sw.js  # ES modules parsed as modules (a plain --check can miss errors), then the service worker
          for f in *.sh installer/*.sh; do sh -n "$f"; done
          bash -n proxmox/ct/iopix.sh proxmox/install/iopix-install.sh
      - name: Tests that need no photo library
        # the full suite cuts a scratch copy from a digiKam library, so it runs on a developer machine
        # (.venv/bin/python -m pytest tests); without one, conftest skips those and these still run
        run: |
          python -m pip install -q numpy  # the search-model switch test builds vectors
          python -m pytest -q -p no:cacheprovider tests/test_imports.py tests/test_jobs.py tests/test_models_registry.py tests/test_query.py tests/test_settings_state.py tests/test_auto_models.py tests/test_semantic_switch.py tests/test_review_fixes.py

  image:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the installer is attached to the release on a version tag
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            AI=1
            CAPTIONS=0
          cache-from: type=gha
          cache-to: type=gha,mode=max

  installer:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the self-extracting Linux installer
        run: ./installer/make-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: iopix-install.sh
          path: dist/iopix-install.sh
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/iopix-install.sh
