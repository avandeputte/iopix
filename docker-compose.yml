# iopix with Docker: `docker compose up -d` pulls the published image; `docker compose up -d --build`
# builds it from this checkout instead (build arguments AI / CAPTIONS, see the Dockerfile). Works as a stack in Dockge / Portainer.
# Edit the three "CHANGE ME" spots (photos path, database, admin password). Everything the viewer
# writes (index, thumbnails, models, users, backups) lives in the named volume `dkv-data` (its name from before the rename, kept so existing stacks keep their data); the
# library mounts are read-only. On the first start the container downloads the AI models named
# in AUTO_MODELS (about 1.6 GB) into the volume while the library is already browsable.
#
# The image is public on GitHub's registry: no login is needed to pull it.
services:
  iopix:
    image: ghcr.io/avandeputte/iopix:latest
    build:
      context: .
      # args: { AI: "1", CAPTIONS: "0" }
    container_name: iopix
    restart: unless-stopped
    ports:
      - "8600:8600"
    volumes:
      - /path/to/photos:/library/photos:ro          # CHANGE ME: the folder digiKam manages
      - dkv-data:/data                            # the container runs as uid 1000: a volume from before that needs chown -R 1000:1000 once (README)
      # SQLite instead of MariaDB: also mount the folder with digikam4.db and drop the DIGIKAM_DB_* lines below
      # - /path/to/digikamDB:/library/digikamDB:ro
    environment:
      TZ: America/New_York
      # digiKam's database on MariaDB (the viewer only reads it unless an editor changes metadata,
      # and then it takes a mysqldump into the volume first)
      DIGIKAM_DB_TYPE: mysql
      DIGIKAM_DB_HOST: db.example.lan                 # CHANGE ME: your MariaDB host or IP
      DIGIKAM_DB_PORT: "3306"
      DIGIKAM_DB_NAME: digikam
      DIGIKAM_DB_USER: digikam
      DIGIKAM_DB_PASSWORD: change-me                  # CHANGE ME
      # where the photos are inside this container; the album root digiKam recorded
      # (e.g. /Users/alex/Pictures/photos) is mapped to it (Settings > Album roots can also do this per root)
      PHOTOS_ROOT: /library/photos
      # the first admin account, created on the first start: visitors then browse read-only and every change
      # needs an editor or admin sign-in (remove both lines to start open, and create the admin from Settings)
      ADMIN_USER: admin
      ADMIN_PASSWORD: change-me-please                # CHANGE ME (8 characters or more)
      # models fetched on first start: content search (SigLIP 2), objects (YOLOX), places (GeoNames)
      AUTO_MODELS: siglip2,yolox,geonames
      # cores one background job may use (default: half); the container cannot see digiKam, so
      # before database writes the viewer asks you to confirm digiKam is closed
      # BG_THREADS: "2"
      DIGIKAM_CHECK: none
      # READ_ONLY: "1"                               # browsing only, for everyone
      # GOOGLE_MAPS_API_KEY: ""                      # Settings > Map provider can store it instead
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8600/api/status', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 60s

volumes:
  dkv-data:
