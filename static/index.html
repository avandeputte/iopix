<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-Sl/rS+KC0nrtSAjt3RgE5IwLxyv1e0dVtjjbXx89p8I='; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self'; frame-src https://www.google.com https://maps.google.com; worker-src 'self'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>iopix</title>
<link rel="icon" href="icons/mark.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3b4a8c">
<script>var t = 'light'; try { t = localStorage.getItem('iopix.theme') || 'light'; } catch (e) {} if (t !== 'system') document.documentElement.dataset.theme = t === 'dark' ? 'dark' : 'light';</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="topbar">
  <button id="menubtn" class="iconbtn" title="Show the sidebar" aria-label="Show the sidebar"><span class="ic" data-ic="menu"></span></button>
  <div id="search">
    <div id="searchbox">
      <span class="ic" data-ic="search"></span>
      <div id="chips"></div>
      <input id="q" type="text" placeholder="Search people, tags, folders, cameras, captions…" autocomplete="off" spellcheck="false">
      <button id="clear" class="iconbtn" title="Clear search" hidden><span class="ic" data-ic="close"></span></button>
    </div>
    <div id="suggest" hidden></div>
  </div>
  <button id="filterbtn" class="pillbtn" title="Browse and filter by any metadata"><span class="ic" data-ic="tune"></span><span>Filters</span></button>
  <span id="usermenu"></span>
</header>
<nav id="nav">
  <div class="navhead">
    <a class="brand" href="#/explore" title="Home"><span class="brand-name"><span class="io">io</span><span class="pix">pix</span></span></a>
    <button id="sidebtn" class="iconbtn"><span class="ic" data-ic="menuOpen"></span></button>
  </div>
</nav>
<div id="navscrim" hidden></div>
<nav id="crumbbar" class="crumbs" hidden></nav>
<main id="main"></main>
<aside id="filters" hidden></aside>
<div id="lightbox" hidden></div>
<div id="toast" hidden role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
