# iopix: one place for the Python dependencies. The base set runs the viewer;
# the optional groups add the AI features (setup.sh asks which ones you want):
#   pip install -e '.[search,ocr,objects]'        (or: '.[ai]' for those three)
#   pip install -e '.[captions]' --extra-index-url https://download.pytorch.org/whl/cpu
#   pip install -e '.[test]'                      (pytest, Playwright)
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iopix"
version = "1.48.3"
description = "Web front end for a digiKam library, with local AI search"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi",
  "uvicorn",
  "pillow",
  "pillow-heif",
  "orjson",
  "pymysql",
  "python-multipart",
  "mcp",
]

[project.optional-dependencies]
search = ["fastembed", "huggingface_hub", "numpy"]       # CLIP / SigLIP 2 content search (ONNX Runtime)
ocr = ["rapidocr"]                                       # text in photos
objects = ["numpy", "onnxruntime"]                       # YOLOX object detection
captions = ["torch>=2,<3", "transformers>=5,<6"]         # BLIP photo descriptions (large; CPU wheels from the PyTorch index)
ai = ["fastembed", "huggingface_hub", "numpy", "rapidocr", "onnxruntime"]
test = ["pytest", "httpx", "playwright", "pytest-playwright", "pyflakes"]

[project.urls]
Homepage = "https://github.com/avandeputte/iopix"

[tool.setuptools.packages.find]
include = ["app*"]
